utput-head, #root-public-review .row { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; }\n    #root-public-review header { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); align-items: center; gap: 8px 14px; background: var(--paper); border-radius: 40px; padding: 7px 9px 7px 17px; }\n    #root-public-review .header-nav { justify-content: center; }\n    #root-public-review .header-nav a { color: var(--muted); padding: 6px; }\n    #root-public-review .header-entry { justify-self: end; }\n    #root-public-review .brand { display: flex; align-items: center; gap: 9px; font-weight: 750; font-size: 16px; letter-spacing: .24em; }\n    #root-public-review .dot { width: 8px; height: 8px; border-radius: 2px; background: var(--blue); }\n    #root-public-review button, #root-public-review .link-button { color: inherit; font: inherit; padding: 7px 13px; min-height: 38px; border: 1px solid var(--line); background: var(--paper); border-radius: 999px; }\n    #root-public-review .link-button { display: inline-flex; align-items: center; text-decoration: none; }\n    #root-public-review .primary { background: var(--action); color: var(--on-action); border-color: var(--action); }\n    #root-public-review .hero { display: grid; grid-template-columns: minmax(0,1.2fr) minmax(0,.8fr); align-items: center; gap: clamp(25px,5vw,60px); min-height: 450px; padding: clamp(48px,8vw,100px) clamp(9px,4vw,52px); }\n    #root-public-review .hero h1 { font: 600 clamp(40px,6.6vw,76px)/1.1 'Songti SC',STSong,serif; letter-spacing: -.05em; margin: 16px 0; }\n    #root-public-review .lead { color: var(--muted); font-size: clamp(14px,1.85vw,18px); max-width: 26em; }\n    #root-public-review .hero .buttons { margin-top: 21px; }\n    #root-public-review .hero .trial-note { margin-top: 9px; }\n    #root-public-review .trial-note { color: var(--muted); font-size: 12px; }\n    #root-public-review .kicker { color: var(--blue); font-size: 11px; letter-spacing: .13em; font-weight: 650; }\n    #root-public-review .chapter { padding: clamp(42px,7vw,86px) clamp(18px,6vw,68px); border-top: 1px solid var(--line); }\n    #root-public-review .chapter h2 { font: 600 clamp(27px,4vw,43px)/1.18 'Songti SC',STSong,serif; margin: 9px 0 12px; }\n    #root-public-review .chapter .lead { margin-bottom: 25px; max-width: 40em; }\n    #root-public-review .pipeline { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 12px 18px; align-items: start; margin: 0; }\n    #root-public-review .frame { min-width: 0; padding: 13px 14px 9px; background: var(--paper); border: 1px solid var(--line); border-radius: 17px; box-shadow: 0 14px 34px color-mix(in srgb,var(--ink) 8%,transparent); }\n    #root-public-review .glimpse { padding: 23px; transform: rotate(-2deg); }\n    #root-public-review .glimpse h2 { font-size: 22px; margin: 6px 0 15px; }\n    #root-public-review .glimpse .row { padding: 12px 0; }\n    #root-public-review .glimpse .count { padding-top: 10px; }\n    #root-public-review .between { grid-column: 1 / -1; color: var(--blue); font-size: 12px; }\n    #root-public-review .chapter[id], #root-public-review #root-site-trial { scroll-margin-top: 16px; }\n    #root-public-review .workspace-entry .trial-note { margin-top: 7px; }\n    #root-public-review .output-head { justify-content: space-between; margin-bottom: 4px; }\n    #root-public-review .output-head h3 { font: 600 clamp(19px,3vw,25px)/1.2 'Songti SC',STSong,serif; }\n    #root-public-review .output-head button { font-size: 12px; }\n    #root-public-review .sample-table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 12px; table-layout: fixed; }\n    #root-public-review .sample-table th, #root-public-review .sample-table td { padding: 5px 4px; text-align: left; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }\n    #root-public-review .sample-table tr:last-child td { border-bottom: 0; }\n    #root-public-review .sample-table th:first-child { width: 40%; }\n    #root-public-review .sample-table th, #root-public-review .state { color: var(--muted); }\n    #root-public-review .row { justify-content: space-between; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13px; }\n    #root-public-review .row label { display: inline-flex; align-items: center; gap: 6px; }\n    #root-public-review input { accent-color: var(--blue); }\n    #root-public-review .state, #root-public-review .count { font-size: 12px; }\n    #root-public-review .count { color: var(--blue); }\n    #root-public-review .chapter-soft { background: var(--mist); }\n    #root-public-review .feature { display: grid; grid-template-columns: minmax(0,.9fr) minmax(0,1.1fr); align-items: start; gap: clamp(16px,4vw,52px); }\n    #root-public-review .feature-example { padding: 18px; }\n    #root-public-review .story { list-style: none; margin: 0; padding: 0; }\n    #root-public-review .story li { padding: 11px 0; }\n    #root-public-review .story li + li { border-top: 1px solid var(--line); }\n    #root-public-review .story h3 { font-size: 15px; margin-bottom: 4px; }\n    #root-public-review .story p, #root-public-review .example-text p { color: var(--muted); }\n    #root-public-review .example-text { margin-bottom: 21px; }\n    #root-public-review .example-text strong { display: block; margin-bottom: 5px; }\n    #root-public-review .version { font-variant-numeric: tabular-nums; color: var(--blue); }\n    #root-public-review .roadmap-note { margin-top: 18px; padding-left: 14px; border-left: 2px solid var(--blue); }\n    #root-public-review .roadmap-note h3 { font-size: 16px; margin-bottom: 6px; }\n    #root-public-review .roadmap-note p { color: var(--muted); margin-top: 6px; }\n    #root-public-review .faq h3 { font-size: 16px; margin-bottom: 7px; }\n    #root-public-review .faq details { border-top: 1px solid var(--line); padding: 11px 0; }\n    #root-public-review .faq summary { font-weight: 600; }\n    #root-public-review .faq details p { color: var(--muted); margin-top: 7px; }\n    #root-public-review .site-footer { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 13px 20px; padding: 18px clamp(18px,6vw,68px); border-top: 1px solid var(--line); }\n    #root-public-review .site-footer nav a { padding: 6px; color: var(--muted); }\n    @media(max-width:670px) {\n      #root-public-review .hero, #root-public-review .pipeline, #root-public-review .feature { grid-template-columns: minmax(0,1fr); }\n      #root-public-review .hero { min-height: 0; }\n      #root-public-review .glimpse { max-width: 420px; width: 100%; transform: none; }\n      #root-public-review .feature .lead { margin-bottom: 0; }\n    }\n    @media(max-width:520px) {\n      #root-public-review header { grid-template-columns: minmax(0,1fr) auto; border-radius: 20px; }\n      #root-public-review .header-nav { grid-area: 2 / 1 / 3 / -1; justify-content: flex-start; }\n      #root-public-review .header-entry { grid-area: 1 / 2; }\n    }\n    @media(pointer:coarse) { #root-public-review button, #root-public-review .link-button { min-height:44px; } }\n  \u003c/style>\n  \u003cdiv class=\"page\">\n    \u003cdiv class=\"intro\" id=\"root-site-top\">\n    \u003cheader>\n      \u003cdiv class=\"brand\">ROOT\u003cspan class=\"dot\" aria-hidden=\"true\">\u003c/span>\u003c/div>\n      \u003cnav class=\"buttons header-nav\" aria-label=\"官网导航\">\u003ca href=\"#root-site-assistant\">核心功能\u003c/a>\u003ca href=\"#root-site-example\">交互示例\u003c/a>\u003ca href=\"#root-site-about\">关于我们\u003c/a>\u003c/nav>\n      \u003ca class=\"link-button header-entry cursor-interaction\" href=\"#\" data-review-link>进入工作台\u003c/a>\n    \u003c/header>\n    \u003csection class=\"hero\" aria-labelledby=\"root-site-title\">\n      \u003cdiv>\n        \u003cp class=\"kicker\">ROOT / 工具工作台\u003c/p>\n        \u003ch1 id=\"root-site-title\">把手头的事，\u003cbr>做成小工具。\u003c/h1>\n        \u003cp class=\"lead\">想法还模糊，先用需求助手梳理。已有明确需求或表格，就直接做成能操作的小工具。\u003c/p>\n        \u003cdiv class=\"buttons\">\u003ca class=\"link-button primary cursor-interaction\" href=\"#root-site-trial\">立即试用\u003c/a>\u003ca class=\"link-button cursor-interaction\" href=\"#root-site-assistant\">看看怎么做\u003c/a>\u003c/div>\n        \u003cp class=\"trial-note\">用示例数据直接体验，无需账号。\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"frame glimpse\" aria-label=\"生成结果示意\">\n        \u003cp class=\"kicker\">生成结果示意\u003c/p>\n        \u003ch2>交付跟进板\u003c/h2>\n        \u003cdiv class=\"row\">\u003cspan>确认演示范围\u003c/span>\u003cspan class=\"state\">待完成\u003c/span>\u003c/div>\n        \u003cdiv class=\"row\">\u003cspan>准备样例数据\u003c/span>\u003cspan class=\"state\">进行中\u003c/span>\u003c/div>\n        \u003cdiv class=\"row\">\u003cspan>复核体验入口\u003c/span>\u003cspan class=\"state\">已完成\u003c/span>\u003c/div>\n        \u003cp class=\"count\">还有 2 项未完成\u003c/p>\n      \u003c/div>\n    \u003c/section>\n    \u003c/div>\n    \u003csection class=\"chapter chapter-soft feature\" id=\"root-site-assistant\" aria-labelledby=\"root-assistant-title\">\n      \u003cdiv>\n        \u003cp class=\"kicker\">01 / 需求助手\u003c/p>\n        \u003ch2 id=\"root-assistant-title\">想法还不清楚？先把需求理顺。\u003c/h2>\n        \u003cp class=\"lead\">说说你遇到的问题。助手给出可选方向，追问会影响工具用法的细节，再整理成可编辑的需求稿。可以先存草稿，想好了再生成。\u003c/p>\n      \u003c/div>\n      \u003col class=\"frame feature-example story\" aria-label=\"需求助手示意\">\n        \u003cli>\u003ch3>你遇到的问题\u003c/h3>\u003cp>「团队的交付事项总要到群里问进度。」\u003c/p>\u003c/li>\n        \u003cli>\u003ch3>选方向，回答一个关键问题\u003c/h3>\u003cp>在「交付跟进板」和「个人提醒清单」里选看板。助手问要先看哪类事项，你选「本周到期」。\u003c/p>\u003c/li>\n        \u003cli>\u003ch3>拿到一份可改的需求稿\u003c/h3>\u003cp>「做一个交付跟进板，记录事项、负责人、截止日和状态，默认看本周到期，可勾选完成。」\u003c/p>\u003c/li>\n      \u003c/ol>\n    \u003c/section>\n    \u003csection class=\"chapter\" id=\"root-site-example\" aria-labelledby=\"root-example-title\">\n      \u003cp class=\"kicker\">02 / 直接开发\u003c/p>\n      \u003ch2 id=\"root-example-title\">需求想清楚了，就直接做。\u003c/h2>\n      \u003cp class=\"lead\">描述你想要的工具，或导入手头已有的表格。用文字可以从零开始，用表格可以带上原有记录。\u003c/p>\n      \u003cdiv class=\"frame example-text\">\n        \u003cstrong>用一句话做读书清单\u003c/strong>\n        \u003cp>「我想记录书名和阅读状态，能标记已读，重新打开还看得到记录。」\u003c/p>\n      \u003c/div>\n      \u003cfigure class=\"pipeline\" aria-label=\"同三条交付事项从表格变成可操作的看板\">\n        \u003cfigcaption class=\"between\">用表格做交付跟进板 · 确认字段后生成，保留 3 条原记录\u003c/figcaption>\n        \u003cdiv class=\"frame source\">\u003cp class=\"kicker\">01 / 导入表格\u003c/p>\u003cstrong>交付跟进表\u003c/strong>\n          \u003ctable class=\"sample-table\" aria-label=\"导入前的四列三条记录\">\u003cthead>\u003ctr>\u003cth scope=\"col\">事项\u003c/th>\u003cth scope=\"col\">负责人\u003c/th>\u003cth scope=\"col\">截止日\u003c/th>\u003cth scope=\"col\">状态\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n            \u003ctr>\u003ctd>确认演示范围\u003c/td>\u003ctd>小林\u003c/td>\u003ctd>11/08\u003c/td>\u003ctd>待完成\u003c/td>\u003c/tr>\u003ctr>\u003ctd>准备样例数据\u003c/td>\u003ctd>小周\u003c/td>\u003ctd>11/10\u003c/td>\u003ctd>进行中\u003c/td>\u003c/tr>\u003ctr>\u003ctd>复核体验入口\u003c/td>\u003ctd>小陈\u003c/td>\u003ctd>11/09\u003c/td>\u003ctd>已完成\u003c/td>\u003c/tr>\n          \u003c/tbody>\u003c/table>\n        \u003c/div>\n        \u003cdiv class=\"frame result\" id=\"root-site-trial\">\u003cp class=\"kicker\">02 / 试用工具\u003c/p>\n          \u003cdiv class=\"output-head\">\u003ch3>交付跟进板\u003c/h3>\u003cbutton type=\"button\" class=\"cursor-interaction\" data-filter aria-pressed=\"false\">只看未完成\u003c/button>\u003c/div>\n          \u003cdiv class=\"row\" data-item>\u003clabel>\u003cinput type=\"checkbox\">确认演示范围\u003c/label>\u003cspan class=\"state\" data-status=\"待完成\">待完成\u003c/span>\u003c/div>\n          \u003cdiv class=\"row\" data-item>\u003clabel>\u003cinput type=\"checkbox\">准备样例数据\u003c/label>\u003cspan class=\"state\" data-status=\"进行中\">进行中\u003c/span>\u003c/div>\n          \u003cdiv class=\"row\" data-item>\u003clabel>\u003cinput type=\"checkbox\" checked>复核体验入口\u003c/label>\u003cspan class=\"state\" data-status=\"待完成\">已完成\u003c/span>\u003c/div>\n          \u003cp class=\"count\" data-count aria-live=\"polite\">还有 2 项未完成\u003c/p>\n        \u003c/div>\n      \u003c/figure>\n    \u003c/section>\n    \u003csection class=\"chapter chapter-soft feature\" id=\"root-site-tools\" aria-labelledby=\"root-tools-title\">\n      \u003cdiv>\n        \u003cp class=\"kicker\">03 / 我的工具\u003c/p>\n        \u003ch2 id=\"root-tools-title\">做完的小工具，下次接着用。\u003c/h2>\n        \u003cp class=\"lead\">在「我的工具」找回已保存的工具和记录。用着发现少了一个功能，可以描述想改的地方，再查看工具的版本历史。\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"frame feature-example\">\n        \u003cp class=\"kicker\">继续修改示意\u003c/p>\n        \u003cul class=\"story\">\n          \u003cli>\u003ch3>交付跟进板\u003c/h3>\u003cp>已保存 3 条交付事项\u003c/p>\u003c/li>\n          \u003cli>\u003ch3>\u003cspan class=\"version\">v2\u003c/span> · 加了「本周到期」筛选\u003c/h3>\u003cp>保留原有记录，继续跟进。\u003c/p>\u003c/li>\n          \u003cli>\u003ch3>\u003cspan class=\"version\">v1\u003c/span> · 从交付跟进表创建\u003c/h3>\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n    \u003c/section>\n    \u003csection class=\"chapter workspace-entry\" aria-labelledby=\"root-site-start\">\n      \u003ch2 id=\"root-site-start\">有件事想做成工具？\u003c/h2>\n      \u003ca class=\"link-button primary cursor-interaction\" href=\"#\" data-review-link>用自己的需求试试 →\u003c/a>\n      \u003cp class=\"trial-note\">生成自己的工具需登录工作台。受邀评审可在工作台选择「凭邀请码注册」，邀请码由项目方发放。\u003c/p>\n    \u003c/section>\n    \u003csection class=\"chapter chapter-soft feature\" id=\"root-site-about\" aria-labelledby=\"root-about-title\">\n      \u003cdiv>\n        \u003cp class=\"kicker\">关于我们\u003c/p>\n        \u003ch2 id=\"root-about-title\">关于 ROOT\u003c/h2>\n        \u003cp class=\"lead\">日常工作里总有些事值得有个专门的小工具。ROOT 让你用自己的话或已有的表格，做出符合自己用法的清单、看板和计算器。\u003c/p>\n        \u003caside class=\"roadmap-note\" id=\"root-site-roadmap\" aria-labelledby=\"root-roadmap-title\">\n          \u003ch3 id=\"root-roadmap-title\">开发计划\u003c/h3>\n          \u003cp>本轮 Demo 聚焦模板生成。网站模板计划覆盖单页落地页和多页品牌官网，可在工作台内预览和保存。\u003c/p>\n          \u003cp>后续会逐步开放页面组合和更灵活的生成能力。预计 11 月底更新进度。\u003c/p>\n        \u003c/aside>\n      \u003c/div>\n      \u003cdiv class=\"faq\" id=\"root-site-faq\">\n        \u003ch3>常见问题\u003c/h3>\n        \u003cdetails>\u003csummary class=\"cursor-interaction\">试用需要账号吗？\u003c/summary>\u003cp>点「立即试用」即可操作示例。用自己的需求或表格生成工具时，需要登录工作台。\u003c/p>\u003c/details>\n        \u003cdetails>\u003csummary class=\"cursor-interaction\">邀请码从哪里获取？\u003c/summary>\u003cp>请向邀请你体验 ROOT 的项目方获取邀请码。收到后，点击「进入工作台」，选择「凭邀请码注册」并填入邀请码。新码自生成起 72 小时有效。此前发放的邀请码以原到期时间为准。每码可成功注册一次。过期或已使用时，请向邀请人索取新码。\u003c/p>\u003c/details>\n        \u003cdetails>\n          \u003csummary class=\"cursor-interaction\">ROOT 适合做哪些工具？\u003c/summary>\n          \u003cp>把你的文字需求做成可操作的网页工具。你可以用它登记和筛选记录、跟踪进度，或按自己的规则做测算。\u003c/p>\n          \u003cp>如果手头已有表格，可以导入带表头的 CSV 或 XLSX，确认字段后用原有记录生成工具。XLSX 读取第一个工作表。\u003c/p>\n        \u003c/details>\n        \u003cdetails>\n          \u003csummary class=\"cursor-interaction\">工具里的数据会保存吗？\u003c/summary>\n          \u003cp>登录工作台后，工具和里面的记录会保存到你的账号，可以从「我的工具」重新打开，保存期限按试用规则执行。官网试用用的是示例数据，刷新后会恢复原样。\u003c/p>\n        \u003c/details>\n        \u003cdetails>\n          \u003csummary class=\"cursor-interaction\">首版有哪些限制？\u003c/summary>\n          \u003cp>\u003cstrong>数据与协作\u003c/strong> · 暂不支持通用数据库、附件存储和多人共享编辑。\u003c/p>\n          \u003cp>\u003cstrong>声音与设备\u003c/strong> · 暂不支持音视频播放、录音和语音功能，也不支持调用摄像头、麦克风、蓝牙或 USB 设备。\u003c/p>\n          \u003cp>\u003cstrong>联网与自动化\u003c/strong> · 暂不支持同步原表、连接外部系统和定时后台任务。\u003c/p>\n        \u003c/details>\n        \u003cdetails>\u003csummary class=\"cursor-interaction\">可以把生成的工具公开发布吗？\u003c/summary>\u003cp>这个 Demo 的工具用于工作台内试用、保存和继续修改。公开发布暂未开放。\u003c/p>\u003c/details>\n      \u003c/div>\n    \u003c/section>\n    \u003cfooter class=\"site-footer\">\n      \u003cdiv class=\"brand\">ROOT\u003cspan class=\"dot\" aria-hidden=\"true\">\u003c/span>\u003c/div>\n      \u003cnav class=\"buttons\" aria-label=\"页尾导航\">\u003ca href=\"#root-site-about\">关于我们\u003c/a>\u003ca href=\"#root-site-faq\">常见问题\u003c/a>\u003ca href=\"#root-site-top\">返回顶部\u003c/a>\u003c/nav>\n    \u003c/footer>\n  \u003c/div>\n  \u003cscript>\n    (() => {\n      const root = document.getElementById('root-public-review');\n      root.querySelectorAll('[data-review-link]').forEach(link => {\n        link.addEventListener('click', event => event.preventDefault());\n      });\n      const q = selector => root.querySelector(selector);\n      const items = Array.from(root.querySelectorAll('[data-item]'));\n      const filter = q('[data-filter]');\n      root.querySelectorAll('a[href^=\"#root-site-\"]').forEach(link => {\n        link.addEventListener('click', event => {\n          event.preventDefault();\n          const target = q(link.hash);\n          target.scrollIntoView({ block: 'start' });\n          if (target.id === 'root-site-trial') filter.focus({ preventScroll: true });\n        });\n      });\n      let filtered = false;\n      function update() {\n        let remaining = 0;\n        items.forEach(item => {\n          const completed = item.querySelector('input').checked;\n          const status = item.querySelector('[data-status]');\n          item.hidden = filtered && completed;\n          status.textContent = completed ? '已完成' : status.dataset.status;\n          if (!completed) remaining++;\n        });\n        q('[data-count]').textContent = `还有 ${remaining} 项未完成`;\n      }\n      filter.addEventListener('click', () => {\n        filtered = !filtered;\n        filter.setAttribute('aria-pressed', String(filtered));\n        filter.textContent = filtered ? '显示全部' : '只看未完成';\n        update();\n      });\n      items.forEach(item => item.addEventListener('change', update));\n    })();\n  \u003c/script>\n\u003c/div>\n\u003c/body>\n\u003c/html>\n", "workbench": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>ROOT 工具工作台\u003c/title>\n\u003cstyle>\nhtml { background: #fafafe; }\nbody { margin: 0; padding: clamp(10px, 2vw, 24px); }\n.elys-product { max-width: 1350px; margin-inline: auto; }\nbutton:enabled { cursor: pointer; }\n  .elys-product {\n    color-scheme: light;\n    --elys-ink: #1d1d22;\n    --elys-muted: #565969;\n    --elys-line: #dfe1e9;\n    --elys-border: #adb1c0;\n    --elys-white: #fafafe;\n    --elys-wash: #e9ecfa;\n    --elys-blue: #6883d0;\n    --elys-error: #a3372e;\n    --elys-serif: \"Songti SC\", \"Noto Serif CJK SC\", \"Noto Serif SC\", \"SimSun\", serif;\n    padding: clamp(12px, 2.5vw, 25px);\n    background: radial-gradient(ellipse at 86% 100%, #e4e8fc, transparent 72%), linear-gradient(130deg, #f7f7fc, #eceefa);\n    border-radius: 22px;\n    color: var(--elys-ink);\n    font: 400 14px/1.6 -apple-system, BlinkMacSystemFont, \"PingFang SC\", \"Microsoft YaHei\", sans-serif;\n  }\n  .elys-product * { box-sizing: border-box; }\n  .elys-product [hidden] { display: none !important; }\n  .elys-product :is(h1, h2, h3, p, ol) { margin: 0; }\n  .elys-masthead {\n    display: flex;\n    align-items: center;\n    gap: 9px;\n    min-height: 56px;\n    padding: 5px 16px;\n    border: 1px solid #e6e7ef;\n    border-radius: 999px;\n    background: #fafafe;\n    box-shadow: 0 8px 24px #323d6810;\n  }\n  .elys-wordmark {\n    display: inline-flex;\n    align-items: center;\n    gap: 2px;\n    color: #15151b;\n    font: 900 23px/.95 \"Avenir Next\", \"Arial Black\", sans-serif;\n  }\n  .elys-counter {\n    display: grid;\n    width: 15px;\n    height: 16px;\n    place-items: center;\n    background: currentColor;\n    clip-path: polygon(19% 0, 81% 0, 100% 18%, 100% 82%, 81% 100%, 19% 100%, 0 82%, 0 18%);\n  }\n  .elys-counter::before {\n    content: \"\";\n    width: 7px;\n    height: 7px;\n    background: radial-gradient(circle, #15151b 0 1px, var(--elys-white) 1.25px);\n  }\n  .elys-brand-accent {\n    width: 8px;\n    height: 8px;\n    background: #879cea;\n    border-radius: 2px;\n  }\n  .elys-brand-caption { font-size: 13px; }\n  .elys-workspace {\n    display: grid;\n    grid-template-columns: minmax(215px, .29fr) minmax(0, .71fr);\n    grid-template-areas: \"sidebar content\";\n    gap: clamp(20px, 3.4vw, 34px);\n    margin-block-start: clamp(21px, 3.6vw, 37px);\n  }\n  .elys-composer { min-width: 0; }\n  :is(#composer-title, .elys-empty h3) {\n    font-family: var(--elys-serif);\n    font-weight: 750;\n    line-height: 1.2;\n    letter-spacing: -.045em;\n  }\n  #composer-title { font-size: clamp(21px, 3vw, 28px); }\n  .elys-intro { margin-block-start: 10px; color: var(--elys-muted); }\n  .elys-requirement { margin-block-start: 28px; }\n  #generation-scope label { display: block; font-weight: 650; margin-block-end: 5px; }\n  #generation-category {\n    box-sizing: border-box;\n    width: 100%;\n    min-height: 40px;\n    padding: 6px 10px;\n    border: 1px solid var(--elys-line);\n    border-radius: 8px;\n    color: inherit;\n    background: white;\n    font: inherit;\n  }\n  #generation-scope-copy { font-size: 0.875rem; margin-block: 8px 0; }\n  .elys-product label { display: block; font-size: 13px; font-weight: 650; }\n  .elys-product :is(input, textarea) {\n    inline-size: 100%;\n    min-inline-size: 0;\n    border: 1px solid var(--elys-border);\n    border-radius: 9px;\n    padding: 9px 12px;\n    background: var(--elys-white);\n    color: var(--elys-ink);\n    font: inherit;\n  }\n  .elys-product :is(input, textarea)::placeholder { color: #666a7b; opacity: 1; }\n  .elys-product textarea { display: block; margin-block-start: 8px; min-block-size: 113px; resize: vertical; }\n  .elys-actions {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    gap: 8px;\n    margin-block-start: 16px;\n  }\n  .elys-product button {\n    font: inherit;\n    font-weight: 650;\n    min-block-size: 36px;\n    padding: 6px 15px;\n    border: 1px solid var(--elys-border);\n    border-radius: 999px;\n    white-space: nowrap;\n  }\n  .elys-product :is(button, input, textarea):focus-visible {\n    outline: 2px solid #4565b9;\n    outline-offset: 2px;\n  }\n  .elys-product .elys-primary { background: #202127; color: #fff; border-color: #202127; }\n  .elys-product .elys-example,\n  .elys-product[data-state=\"failure\"] #generate { background: var(--elys-white); color: var(--elys-ink); }\n  .elys-product #generate { margin-inline-start: auto; }\n  .elys-product button:enabled:hover { filter: brightness(.94); }\n  .elys-product button:disabled { background: #e2e4f0; color: #5e6275; border-color: #c9cede; }\n  .elys-error { color: var(--elys-error); font-size: 13px; }\n  .elys-loading { margin-block-start: 16px; color: var(--elys-muted); }\n  .elys-loading p { color: var(--elys-ink); }\n  .elys-loading ol { display: flex; flex-wrap: wrap; gap: 4px 23px; padding-inline-start: 19px; font-size: 12px; }\n  .elys-loading [aria-current=\"step\"] { color: #38539c; font-weight: 700; }\n  .elys-preview {\n    display: flex;\n    flex-direction: column;\n    min-width: 0;\n    min-height: 405px;\n    padding: clamp(16px, 2.6vw, 28px);\n    border: 1px solid #dce0ee;\n    border-radius: 24px;\n    background: #f9f9fd;\n    box-shadow: 0 18px 42px #45559219;\n  }\n  .elys-preview-header {\n    display: flex;\n    flex-wrap: wrap;\n    align-items: center;\n    justify-content: space-between;\n    gap: 4px 10px;\n    padding-block-end: 12px;\n    border-block-end: 1px solid var(--elys-line);\n  }\n  .elys-preview-header h2 { font-size: 15px; font-weight: 700; }\n  .elys-status {\n    display: inline-flex;\n    align-items: center;\n    gap: 8px;\n    color: var(--elys-muted);\n    font-size: 12px;\n  }\n  .elys-status::before {\n    content: \"\";\n    inline-size: 6px;\n    block-size: 6px;\n    border-radius: 50%;\n    background: #8d91a0;\n  }\n  .elys-status[data-usable]::before {\n    background: var(--elys-blue);\n    box-shadow: 0 0 0 3px #e1e7fa;\n  }\n  .elys-e -completed] { color: #245c47; }\n.staged-detail li[aria-current=\"step\"] { font-weight: 700; color: #38539c; }\n.staged-panel .entry-actions:has(button:not([hidden])) { margin-block-start: 9px; }\n.staged-panel .entry-actions:not(:has(button:not([hidden]))) { display: none; }\n#staged-history { margin-block-start: 10px; border-top: 1px solid var(--elys-line); padding-block-start: 8px; }\n#staged-history summary { cursor: pointer; font-weight: 650; }\n#staged-history-list li { display: grid; gap: 5px; padding: 8px; border: 1px solid var(--elys-line); border-radius: 9px; }\n#staged-history-list p { white-space: pre-wrap; overflow-wrap: anywhere; }\n#staged-history-list button { inline-size: fit-content; }\n\n\u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain class=\"elys-product\" data-state=\"initial\">\n    \u003cheader class=\"elys-masthead\">\n      \u003cspan class=\"elys-wordmark\" role=\"img\" aria-label=\"ROOT\">R\u003cspan class=\"elys-counter\" aria-hidden=\"true\">\u003c/span>\u003cspan class=\"elys-counter\" aria-hidden=\"true\">\u003c/span>T\u003c/span>\n      \u003cspan class=\"elys-brand-accent\" aria-hidden=\"true\">\u003c/span>\n      \u003cspan class=\"elys-brand-caption\">工具工作台\u003c/span>\n      \u003ca id=\"updates-back\" class=\"masthead-link\" href=\"/\" hidden>← 返回工作台\u003c/a>\n      \u003cdetails id=\"account\" class=\"account\" hidden>\n        \u003csummary id=\"account-name\" aria-label=\"账号菜单\">\u003c/summary>\n        \u003cdiv class=\"account-menu-items\">\n          \u003ca id=\"updates-link\" href=\"/updates\">工作台更新记录\u003c/a>\n          \u003cbutton id=\"guide-start\" type=\"button\">新手引导\u003c/button>\n          \u003ca id=\"admin-entry\" href=\"/admin\" hidden>管理后台\u003c/a>\n          \u003cbutton id=\"logout\" type=\"button\">退出登录\u003c/button>\n        \u003c/div>\n      \u003c/details>\n    \u003c/header>\n    \u003csection id=\"updates\" class=\"release-history\" aria-labelledby=\"updates-title\" hidden>\n      \u003cp class=\"auth-eyebrow\">ROOT / RELEASE NOTES\u003c/p>\n      \u003ch1 id=\"updates-title\" tabindex=\"-1\">工作台更新记录\u003c/h1>\n      \u003cp id=\"release-status\" role=\"status\">\u003c/p>\n      \u003col id=\"release-list\" class=\"version-list\">\u003c/ol>\n    \u003c/section>\n    \u003csection id=\"auth\" class=\"auth-layout\" hidden aria-labelledby=\"auth-intro-title\">\n      \u003cdiv id=\"auth-intro\" class=\"auth-intro\">\n        \u003cp class=\"auth-eyebrow\">ROOT / WORKSPACE\u003c/p>\n        \u003ch1 id=\"auth-intro-title\">打开你的工作台\u003c/h1>\n        \u003cp class=\"auth-muted\">生成的小工具和使用记录保存在账号里，重新登录就能接着用。\u003c/p>\n        \u003cdiv class=\"auth-illustration\" aria-hidden=\"true\">\n          \u003cp class=\"auth-eyebrow\">工作台示意\u003c/p>\n          \u003cdiv>\u003cspan>交付跟进板\u003c/span>\u003cspan class=\"auth-muted\">3 项待办\u003c/span>\u003c/div>\n          \u003cdiv>\u003cspan>周末预算\u003c/span>\u003cspan class=\"auth-muted\">2 项支出\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"auth-panel\">\n        \u003ch2 id=\"auth-title\">登录\u003c/h2>\n        \u003cp id=\"auth-description\" class=\"auth-muted\">登录后打开你的工具和记录。\u003c/p>\n        \u003cform id=\"auth-form\" aria-labelledby=\"auth-title\">\n          \u003cdiv class=\"auth-field\" id=\"invite-field\" hidden>\n            \u003clabel for=\"invite\">邀请码\u003c/label>\n            \u003cinput id=\"invite\" maxlength=\"128\" autocomplete=\"off\" placeholder=\"输入评审邀请码\" aria-describedby=\"invite-hint invite-error\">\n            \u003cp id=\"invite-hint\" class=\"auth-hint\">请向邀请你体验 ROOT 的项目方获取邀请码。\u003c/p>\n            \u003cp id=\"invite-error\" class=\"elys-error\" role=\"alert\" hidden>\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"auth-field\">\n            \u003clabel for=\"username\">用户名\u003c/label>\n            \u003cinput id=\"username\" autocomplete=\"username\" maxlength=\"32\" placeholder=\"输入用户名\" aria-describedby=\"username-hint username-error\" required>\n            \u003cp id=\"username-hint\" class=\"auth-hint\" hidden>3–32 位英文字母、数字、连字符（-）或下划线（_）。\u003c/p>\n            \u003cp id=\"username-error\" class=\"elys-error\" role=\"alert\" hidden>\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"auth-field\">\n            \u003clabel for=\"password\">密码\u003c/label>\n            \u003cinput id=\"password\" type=\"password\" autocomplete=\"current-password\" maxlength=\"128\" placeholder=\"输入密码\" aria-describedby=\"password-hint password-error\" required>\n            \u003cp id=\"password-hint\" class=\"auth-hint\" hidden>12–128 个字符。\u003c/p>\n            \u003cp id=\"password-error\" class=\"elys-error\" role=\"alert\" hidden>\u003c/p>\n          \u003c/div>\n          \u003cp id=\"auth-status\" role=\"status\">\u003c/p>\n          \u003cbutton id=\"auth-submit\" class=\"elys-primary\" type=\"submit\">登录\u003c/button>\n        \u003c/form>\n        \u003cbutton id=\"auth-mode\" type=\"button\">凭邀请码注册\u003c/button>\n      \u003c/div>\n    \u003c/section>\n    \u003cdiv id=\"workspace\" class=\"elys-workspace\">\n      \u003caside class=\"workspace-sidebar\" aria-label=\"工作台侧栏\">\n        \u003cdiv class=\"workspace-navigation\">\n          \u003cbutton id=\"new-tool\" type=\"button\" aria-current=\"page\">\u003cspan aria-hidden=\"true\">＋\u003c/span>新建工具\u003c/button>\n          \u003cnav aria-label=\"工作台栏目\">\n            \u003cbutton id=\"idea-entry\" type=\"button\">需求助手\u003c/button>\n            \u003cbutton id=\"library-entry\" type=\"button\" aria-controls=\"saved-tools\" aria-expanded=\"false\">我的工具\u003c/button>\n          \u003c/nav>\n        \u003c/div>\n        \u003csection class=\"tool-library\" id=\"saved-tools\" aria-labelledby=\"library-entry\" hidden>\n          \u003cp id=\"library-empty\">成功生成的工具会显示在这里。\u003c/p>\n          \u003cul id=\"tool-list\" aria-label=\"已保存的工具\">\u003c/ul>\n        \u003c/section>\n        \u003csection class=\"elys-composer\" aria-labelledby=\"composer-title\">\n          \u003ch2 id=\"composer-title\">你想做什么工具？\u003c/h2>\n          \u003cdiv id=\"new-tool-options\">\n            \u003cp class=\"elys-intro\">描述工具的用途、操作和要保存的数据。\u003c/p>\n            \u003cnav class=\"entry-actions\" aria-label=\"开始方式\">\n              \u003cbutton id=\"quick-entry\" type=\"button\" aria-pressed=\"false\" aria-controls=\"quick-panel\">快速体验\u003c/button>\n              \u003cbutton id=\"direct-entry\" type=\"button\" aria-pressed=\"true\">直接开发\u003c/button>\n              \u003cbutton id=\"table-entry\" type=\"button\" aria-pressed=\"false\" aria-controls=\"table-panel\">从表格生成\u003c/button>\n            \u003c/nav>\n          \u003c/div>\n          \u003csection id=\"quick-panel\" class=\"quick-panel\" aria-labelledby=\"quick-title\" hidden>\n            \u003ch3 id=\"quick-title\">先试一个模板\u003c/h3>\n            \u003cdiv class=\"entry-actions\" aria-label=\"可选模板\">\n              \u003cbutton type=\"button\" data-entry-template=\"board\" aria-pressed=\"true\">交付跟进板\u003c/button>\n              \u003cbutton type=\"button\" data-entry-template=\"list\" aria-pressed=\"false\">读书清单\u003c/button>\n              \u003cbutton type=\"button\" data-entry-template=\"budget\" aria-pressed=\"false\">AA 分账\u003c/button>\n            \u003c/div>\n            \u003cdiv class=\"template-description\">\n              \u003cp class=\"auth-eyebrow\">示例需求\u003c/p>\n              \u003cp id=\"template-prompt\">\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"entry-actions\">\n              \u003cbutton id=\"template-sample\" type=\"button\">先试样例\u003c/button>\n              \u003cbutton id=\"template-customize\" type=\"button\">修改示例需求\u003c/button>\n              \u003cbutton id=\"template-generate\" class=\"elys-primary\" type=\"button\">用此模板生成\u003c/button>\n            \u003c/div>\n          \u003c/section>\n          \u003csection id=\"table-panel\" hidden>\u003c/section>\n          \u003cp id=\"generation-balance\" class=\"elys-config\" role=\"status\">剩余 5 / 5 次\u003c/p>\n          \u003cp id=\"generation-block\" class=\"elys-error\" role=\"status\" hidden>\u003c/p>\n          \u003cform id=\"composer\">\n            \u003cdiv id=\"generation-scope\">\n              \u003clabel for=\"generation-category\">生成类别\u003c/label>\n              \u003cselect id=\"generation-category\" aria-describedby=\"generation-scope-copy\">\n                \u003coption value=\"auto\">按需求自动选择\u003c/option>\n                \u003coption value=\"ledger\">清单、台账或看板\u003c/option>\n                \u003coption value=\"program\">计算工具\u003c/option>\n                \u003coption value=\"landing\">单页落地页\u003c/option>\n                \u003coption value=\"brand\">多页品牌官网\u003c/option>\n              \u003c/select>\n              \u003cp id=\"generation-scope-copy\" class=\"auth-muted\">本版支持清单、台账、看板、计算工具、单页落地页和多页品牌官网。结果可在工作台预览、保存和重新打开。后续计划包括自定义组件、数据库、外部服务与公开发布。\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"elys-requirement\">\n              \u003clabel id=\"requirement-label\" for=\"requirement\">工具需求\u003c/label>\n              \u003ctextarea id=\"requirement\" rows=\"5\" maxlength=\"2000\" placeholder=\"例如：做一个读书清单，添加书名后，刷新页面还能看见。\">\u003c/textarea>\n            \u003c/div>\n            \u003cdiv class=\"elys-actions\">\n              \u003cbutton id=\"example\" class=\"elys-example\" type=\"button\">试试读书清单\u003c/button>\n              \u003cp id=\"error\" class=\"elys-error\" role=\"alert\" hidden>\u003c/p>\n              \u003cbutton id=\"generate\" class=\"elys-primary\" type=\"submit\" disabled>生成工具\u003c/button>\n            \u003c/div>\n            \u003cp id=\"generation-retry-note\" class=\"auth-muted\" hidden>生成失败不扣个人次数。\u003c/p>\n          \u003c/form>\n          \u003csection id=\"staged-panel\" class=\"staged-panel\" aria-labelledby=\"staged-title\" hidden>\n            \u003ch3 id=\"staged-title\">生成任务\u003c/h3>\n            \u003cp id=\"staged-list-status\" class=\"auth-muted\" role=\"status\">\u003c/p>\n            \u003cul id=\"staged-task-list\" aria-label=\"尚可查看的生成任务\">\u003c/ul>\n            \u003cdiv id=\"staged-detail\" class=\"staged-detail\" hidden>\n              \u003cp id=\"staged-status\" role=\"status\">\u003c/p>\n              \u003col id=\"staged-steps\" aria-label=\"生成进度\">\u003c/ol>\n              \u003cp id=\"staged-reason\" class=\"elys-error\" hidden>\u003c/p>\n              \u003cp id=\"staged-issue\" class=\"auth-muted\" hidden>\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"entry-actions\">\n              \u003cbutton id=\"staged-resume\" type=\"button\" hidden>恢复中断\u003c/button>\n              \u003cbutton id=\"staged-preview\" type=\"button\" hidden>检查预览\u003c/button>\n              \u003cbutton id=\"staged-sync\" type=\"button\" hidden>核对保存\u003c/button>\n              \u003cbutton id=\"staged-refresh\" type=\"button\" hidden>重新读取任务\u003c/button>\n            \u003c/div>\n            \u003cdetails id=\"staged-history\">\n              \u003csummary>生成历史\u003c/summary>\n              \u003cp id=\"staged-history-status\" class=\"auth-muted\" role=\"status\">\u003c/p>\n              \u003cbutton id=\"staged-history-refresh\" type=\"button\" hidden>重新读取历史\u003c/button>\n              \u003cul id=\"staged-history-list\" aria-label=\"失败或过期的生成任务\">\u003c/ul>\n            \u003c/details>\n          \u003c/section>\n          \u003cdiv id=\"loading\" class=\"elys-loading\" role=\"status\" hidden>\n            \u003cp id=\"phase\">\u003c/p>\n            \u003col aria-label=\"生成阶段\">\n              \u003cli id=\"model-step\">模型生成\u003c/li>\n              \u003cli id=\"preview-step\">准备预览\u003c/li>\n            \u003c/ol>\n          \u003c/div>\n          \u003cp id=\"config\" class=\"elys-config\" role=\"status\" hidden>\u003c/p>\n          \u003cdiv class=\"entry-actions\">\n            \u003cbutton id=\"return-to-library\" type=\"button\" hidden>返回我的工具\u003c/button>\n          \u003c/div>\n        \u003c/section>\n      \u003c/aside>\n      \u003csection id=\"workspace-guide\" class=\"workspace-guide\" aria-labelledby=\"guide-title\" hidden>\n        \u003cp class=\"auth-eyebrow\">欢迎使用 ROOT\u003c/p>\n        \u003ch1 id=\"guide-title\" tabindex=\"-1\">选一个方式开始\u003c/h1>\n        \u003cdiv class=\"welcome-routes\">\n          \u003cbutton id=\"welcome-fast\" type=\"button\">快速体验 \u003csmall>选一个模板，用示例需求生成并试用\u003c/small>\u003c/button>\n          \u003cbutton id=\"welcome-direct\" type=\"button\">直接开发 \u003csmall>输入自己的需求，或从一份表格开始\u003c/small>\u003c/button>\n          \u003cbutton id=\"welcome-idea\" type=\"button\">需求助手 \u003csmall>先梳理想法，再保存或带入开发\u003c/small>\u003c/button>\n        \u003c/div>\n        \u003cbutton id=\"guide-skip\" type=\"button\">跳过引导\u003c/button>\n      \u003c/section>\n      \u003cdiv id=\"guide-hint\" class=\"guide-hint\" hidden>\n        \u003cp id=\"guide-hint-text\" role=\"status\">\u003c/p>\n        \u003cbutton id=\"guide-dismiss\" type=\"button\">跳过引导\u003c/button>\n      \u003c/div>\n      \u003csection id=\"assistant-panel\" hidden>\u003c/section>\n      \u003csection class=\"elys-preview\" aria-labelledby=\"preview-title\">\n        \u003cheader class=\"elys-preview-header\">\n          \u003cp class=\"auth-eyebrow\" aria-hidden=\"true\">工具预览\u003c/p>\n          \u003cspan id=\"preview-status\" class=\"elys-status\" role=\"status\">试用样例\u003c/span>\n          \u003ch2 id=\"preview-title\">工具预览\u003c/h2>\n          \u003cdiv class=\"preview-actions\">\n            \u003cbutton id=\"revise-tool\" type=\"button\" hidden>继续修改\u003c/button>\n            \u003cbutton id=\"tool-history\" type=\"button\" aria-expanded=\"false\" aria-controls=\"tool-version-panel\" hidden>版本历史\u003c/button>\n            \u003cbutton id=\"sync-tool\" type=\"button\" hidden>同步工具\u003c/button>\n          \u003c/div>\n          \u003cdiv id=\"publish-lock\" class=\"publish-lock\" hidden>\n            \u003cbutton id=\"publish-tool\" type=\"button\" aria-describedby=\"publish-explanation\" disabled>发布应用\u003c/button>\n            \u003cp id=\"publish-explanation\">应用发布暂未开放。你仍可在工作台使用和保存这个工具。\u003c/p>\n          \u003c/div>\n        \u003c/header>\n        \u003cp id=\"first-tool-saved\" class=\"elys-config\" role=\"status\" hidden>工具已保存，可从「我的工具」找回。\u003c/p>\n        \u003cp id=\"publication-message\" class=\"elys-config\" role=\"status\" hidden>\u003c/p>\n        \u003cdiv id=\"empty\" class=\"elys-empty\" hidden>\n          \u003ch3 id=\"empty-title\">还没有生成工具\u003c/h3>\n          \u003cp id=\"empty-copy\">输入需求后，工具会在这里出现。\u003c/p>\n        \u003c/div>\n        \u003cdiv id=\"preview\" class=\"preview-frames\">\u003c/div>\n        \u003csection id=\"sample-preview\" class=\"sample-preview\" aria-labelledby=\"sample-title\" hidden>\n          \u003cheader>\n            \u003cdiv>\n              \u003cp class=\"auth-eyebrow\">试用样例\u003c/p>\n              \u003ch3 id=\"sample-title\">\u003c/h3>\n            \u003c/div>\n            \u003cbutton id=\"sample-close\" type=\"button\">关闭样例\u003c/button>\n          \u003c/header>\n          \u003cp class=\"auth-muted\">可以直接操作。试用不会发起生成，也不会保存到「我的工具」。\u003c/p>\n          \u003cdiv id=\"sample-content\">\u003c/div>\n          \u003cp id=\"sample-result\" role=\"status\">\u003c/p>\n        \u003c/section>\n        \u003cfooter class=\"elys-preview-footer\">\n          隔离预览 \u003cspan id=\"storage-warning\" class=\"elys-error\" role=\"status\" hidden>\u003c/span>\n        \u003c/footer>\n        \u003csection id=\"tool-version-panel\" class=\"tool-version-panel\" aria-labelledby=\"tool-version-title\" hidden>\n          \u003cp class=\"auth-eyebrow\" id=\"version-tool-name\">\u003c/p>\n          \u003ch2 id=\"tool-version-title\">工具版本历史\u003c/h2>\n          \u003cp id=\"tool-version-status\" role=\"status\">\u003c/p>\n          \u003col id=\"tool-version-list\" class=\"version-list\">\u003c/ol>\n        \u003c/section>\n      \u003c/section>\n    \u003c/div>\n    \u003cdialog id=\"restore-version-dialog\" aria-labelledby=\"restore-version-title\">\n      \u003cform method=\"dialog\">\n        \u003ch2 id=\"restore-version-title\">恢复此版本\u003c/h2>\n        \u003cp>恢复后沿用当前业务记录。\u003c/p>\n        \u003cdiv class=\"entry-actions\">\n          \u003cbutton value=\"cancel\">取消\u003c/button>\n          \u003cbutton id=\"restore-version-confirm\" value=\"restore\" class=\"elys-primary\">恢复此版本\u003c/button>\n        \u003c/div>\n      \u003c/form>\n    \u003c/dialog>\n  \u003c/main>\n  \u003ctemplate id=\"sample-checklist\">\n    \u003cul class=\"sample-checklist\">\u003c/ul>\n  \u003c/template>\n  \u003ctemplate id=\"sample-budget\">\n    \u003cform class=\"sample-budget\">\n      \u003clabel>总金额（元）\u003cinput id=\"sample-amount\" type=\"number\" min=\"0\" step=\"0.01\" value=\"120\" required>\u003c/label>\n      \u003clabel>人数\u003cinput id=\"sample-people\" type=\"number\" min=\"1\" step=\"1\" value=\"3\" required>\u003c/label>\n      \u003cbutton id=\"sample-calculate\" class=\"elys-primary\" type=\"submit\">计算人均费用\u003c/button>\n    \u003c/form>\n  \u003c/template>\n\u003cscript>\n'use strict';\n\n// These product-owned examples never enter the generated tool storage or model paths.\nconst quickTemplates = {\n  board: {\n    title: '交付跟进板',\n    requirement: '做一个交付跟进板，记录事项、负责人、截止日和状态，可以标记完成。',\n    items: ['确认演示范围 · 小林 · 11 月 9 日', '准备样例数据 · 小陈 · 11 月 10 日', '复核体验入口 · 小王 · 11 月 11 日'],\n    doneLabel: '已完成',\n  },\n  list: {\n    title: '读书清单',\n    requirement: '做一个读书清单，可以标记读完，重新打开时保留记录。',\n    items: ['街道的美学', '海边的卡夫卡', '设计中的设计'],\n    doneLabel: '已读',\n  },\n  budget: {\n    title: 'AA 分账',\n    requirement: '做一个 AA 分账计算器，根据总金额和人数计算人均费用。',\n  },\n};\n\nfunction renderEntryTemplate(templateKey) {\n  const template = quickTemplates[templateKey];\n  document.getElementById('template-prompt').textContent = template.requirement;\n  for (const button of document.querySelectorAll('[data-entry-template]')) {\n    button.setAttribute('aria-pressed', String(button.dataset.entryTemplate === templateKey));\n  }\n}\n\nfunction openSample(templateKey) {\n  const template = quickTemplates[templateKey];\n  const sample = document.getElementById('sample-preview');\n  const content = document.getElementById('sample-content');\n  const result = document.getElementById('sample-result');\n  document.getElementById('sample-title').textContent = template.title;\n  const markup = document.getElementById(templateKey === 'budget' ? 'sample-budget' : 'sample-checklist');\n  content.replaceChildren(markup.content.cloneNode(true));\n\n  if (templateKey === 'budget') {\n    const form = content.querySelector('form');\n    const amount = form.querySelector('#sample-amount');\n    const people = form.querySelector('#sample-people');\n    result.textContent = '输入总金额和人数后计算。';\n    form.addEventListener('submit', event => {\n      event.preventDefault();\n      result.textContent = '人均 ¥' + (amount.valueAsNumber / people.valueAsNumber).toFixed(2);\n    });\n  } else {\n    const list = content.querySelector('ul');\n    for (const name of template.items) {\n      const item = document.createElement('li');\n      const label = document.createElement('label');\n      const checkbox = document.createElement('input');\n      checkbox.type = 'checkbox';\n      checkbox.setAttribute('data-sample-toggle', '');\n      label.append(checkbox, name);\n      item.append(label);\n      list.append(item);\n    }\n    const update = () => {\n      const done = list.querySelectorAll('input:checked').length;\n      result.textContent = template.doneLabel + ' ' + done + '/' + template.items.length;\n    };\n    list.addEventListener('change', update);\n    update();\n  }\n  sample.hidden = false;\n}\n\n\nopenSample('board');\ndocument.getElementById('sample-close').hidden = true;\ndocument.getElementById('example').addEventListener('click', () => {\n  document.getElementById('requirement').value = quickTemplates.list.requirement;\n});\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"};

 .source { background:#fff; }\n    #root-public-review[data-palette=\"refined\"] #root-site-example .result { background:#f9fbff; border-color:#a8bce0; }\n    #root-public-review[data-palette=\"refined\"] .chapter-bar { background:#eaf1fc; }\n    #root-public-review[data-palette=\"refined\"] .workspace-entry { background:#fff; }\n    #root-public-review[data-palette=\"refined\"] #root-site-example .result h3 { color:#233a76; }\n    #root-public-review[data-palette=\"refined\"] #root-site-example .result [data-filter] { color:#233a76; border-color:#91a7ce; }\n    #root-public-review[data-palette=\"refined\"] .intro .hero .primary { background:#f6f8ff; border-color:#f6f8ff; }\n    #root-public-review[data-palette=\"refined\"] .intro .hero .link-button:not(.primary) { background:transparent; border-color:#9aadd4; }\n\n\n\n  \u003c/style>\n  \u003cdiv class=\"page\">\n    \u003cdiv class=\"intro\" id=\"root-site-top\">\n    \u003cheader>\n      \u003cdiv class=\"brand\">ROOT\u003cspan class=\"dot\" aria-hidden=\"true\">\u003c/span>\u003c/div>\n      \u003cnav class=\"buttons header-nav\" aria-label=\"官网导航\">\u003ca href=\"#root-site-assistant\">核心功能\u003c/a>\u003ca href=\"#root-site-example\">交互示例\u003c/a>\u003ca href=\"#root-site-about\">关于我们\u003c/a>\u003c/nav>\n      \u003ca class=\"link-button header-entry cursor-interaction\" href=\"root-sign-in-review.html\">进入工作台\u003c/a>\n    \u003c/header>\n    \u003csection class=\"hero\" aria-labelledby=\"root-site-title\">\n      \u003cdiv>\n        \u003cp class=\"kicker\">ROOT / 工具工作台\u003c/p>\n        \u003ch1 id=\"root-site-title\">把手头的事，\u003cbr>做成小工具。\u003c/h1>\n        \u003cp class=\"lead\">想法还模糊，先用需求助手梳理。已有明确需求或表格，就直接做成能操作的小工具。\u003c/p>\n        \u003cdiv class=\"buttons\">\u003ca class=\"link-button primary cursor-interaction\" href=\"#root-site-trial\">试用示例\u003c/a>\u003ca class=\"link-button cursor-interaction\" href=\"#root-site-assistant\">看看怎么做\u003c/a>\u003c/div>\n        \u003cp class=\"trial-note\">用示例数据直接体验，无需账号。\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"frame glimpse\" aria-label=\"生成结果示意\">\n        \u003cdiv class=\"glimpse-bar\">\u003cspan class=\"glimpse-mark\" aria-hidden=\"true\">\u003c/span>\u003cspan>工具预览\u003c/span>\u003cspan class=\"glimpse-version\">示例\u003c/span>\u003c/div>\n        \u003ch2>交付跟进板\u003c/h2>\n        \u003cdiv class=\"row\">\u003cspan>确认演示范围\u003c/span>\u003cspan class=\"state\" data-status=\"waiting\">待完成\u003c/span>\u003c/div>\n        \u003cdiv class=\"row\">\u003cspan>准备样例数据\u003c/span>\u003cspan class=\"state\" data-status=\"doing\">进行中\u003c/span>\u003c/div>\n        \u003cdiv class=\"row\">\u003cspan>复核体验入口\u003c/span>\u003cspan class=\"state\" data-status=\"done\">已完成\u003c/span>\u003c/div>\n        \u003cp class=\"count\">还有 2 项未完成\u003c/p>\n      \u003c/div>\n    \u003c/section>\n    \u003c/div>\n    \u003csection class=\"chapter chapter-soft feature\" id=\"root-site-assistant\" aria-labelledby=\"root-assistant-title\">\n      \u003cdiv>\n        \u003cp class=\"kicker\">需求助手\u003c/p>\n        \u003ch2 id=\"root-assistant-title\">想法还不清楚？先把需求理顺。\u003c/h2>\n        \u003cp class=\"lead\">说说你遇到的问题。助手给出可选方向，追问会影响工具用法的细节，再整理成可编辑的需求稿。可以先存草稿，想好了再生成。\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"frame story-shell\">\u003cdiv class=\"chapter-bar\">需求梳理示例\u003c/div>\n      \u003col class=\"story\" aria-label=\"需求助手示意\">\n        \u003cli>\u003ch3>你遇到的问题\u003c/h3>\u003cp>「团队的交付事项总要到群里问进度。」\u003c/p>\u003c/li>\n        \u003cli>\u003ch3>选方向，回答一个关键问题\u003c/h3>\u003cp>在「交付跟进板」和「个人提醒清单」里选看板。助手问要先看哪类事项，你选「本周到期」。\u003c/p>\u003c/li>\n        \u003cli class=\"draft\">\u003ch3>拿到一份可改的需求稿\u003c/h3>\u003cp>「做一个交付跟进板，记录事项、负责人、截止日和状态，默认看本周到期，可勾选完成。」\u003c/p>\u003c/li>\n      \u003c/ol>\u003c/div>\n    \u003c/section>\n    \u003csection class=\"chapter\" id=\"root-site-example\" aria-labelledby=\"root-example-title\">\n      \u003cp class=\"kicker\">直接开发\u003c/p>\n      \u003ch2 id=\"root-example-title\">需求想清楚了，就直接做。\u003c/h2>\n      \u003cp class=\"lead\">描述你想要的工具，或导入手头已有的表格。用文字可以从零开始，用表格可以带上原有记录。\u003c/p>\n      \u003cdiv class=\"frame example-text\">\n        \u003cstrong>用一句话做读书清单\u003c/strong>\n        \u003cp>「我想记录书名和阅读状态，能标记已读，重新打开还看得到记录。」\u003c/p>\n      \u003c/div>\n      \u003cfigure class=\"pipeline\" aria-label=\"同三条交付事项从表格变成可操作的看板\">\n        \u003cfigcaption class=\"between\">用表格做交付跟进板 · 确认字段后生成，保留 3 条原记录\u003c/figcaption>\n        \u003cdiv class=\"frame source\">\u003cp class=\"kicker\">原始表格\u003c/p>\u003cstrong>交付跟进表\u003c/strong>\n          \u003ctable class=\"sample-table\" aria-label=\"导入前的四列三条记录\">\u003cthead>\u003ctr>\u003cth scope=\"col\">事项\u003c/th>\u003cth scope=\"col\">负责人\u003c/th>\u003cth scope=\"col\">截止日\u003c/th>\u003cth scope=\"col\">状态\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n            \u003ctr>\u003ctd>确认演示范围\u003c/td>\u003ctd>小林\u003c/td>\u003ctd>11/08\u003c/td>\u003ctd>待完成\u003c/td>\u003c/tr>\u003ctr>\u003ctd>准备样例数据\u003c/td>\u003ctd>小周\u003c/td>\u003ctd>11/10\u003c/td>\u003ctd>进行中\u003c/td>\u003c/tr>\u003ctr>\u003ctd>复核体验入口\u003c/td>\u003ctd>小陈\u003c/td>\u003ctd>11/09\u003c/td>\u003ctd>已完成\u003c/td>\u003c/tr>\n          \u003c/tbody>\u003c/table>\n        \u003c/div>\n        \u003cdiv class=\"frame result\" id=\"root-site-trial\">\u003cp class=\"kicker\">试用工具\u003c/p>\n          \u003cdiv class=\"output-head\">\u003ch3>交付跟进板\u003c/h3>\u003cbutton type=\"button\" class=\"cursor-interaction\" data-filter aria-pressed=\"false\">只看未完成\u003c/button>\u003c/div>\n          \u003cdiv class=\"row\" data-item>\u003clabel>\u003cinput type=\"checkbox\">确认演示范围\u003c/label>\u003cspan class=\"state\" data-status=\"待完成\">待完成\u003c/span>\u003c/div>\n          \u003cdiv class=\"row\" data-item>\u003clabel>\u003cinput type=\"checkbox\">准备样例数据\u003c/label>\u003cspan class=\"state\" data-status=\"进行中\">进行中\u003c/span>\u003c/div>\n          \u003cdiv class=\"row\" data-item>\u003clabel>\u003cinput type=\"checkbox\" checked>复核体验入口\u003c/label>\u003cspan class=\"state\" data-status=\"待完成\">已完成\u003c/span>\u003c/div>\n          \u003cp class=\"count\" data-count aria-live=\"polite\">还有 2 项未完成\u003c/p>\n        \u003c/div>\n      \u003c/figure>\n    \u003c/section>\n    \u003csection class=\"chapter chapter-soft feature\" id=\"root-site-tools\" aria-labelledby=\"root-tools-title\">\n      \u003cdiv>\n        \u003cp class=\"kicker\">我的工具\u003c/p>\n        \u003ch2 id=\"root-tools-title\">做完的小工具，下次接着用。\u003c/h2>\n        \u003cp class=\"lead\">在「我的工具」找回已保存的工具和记录。用着发现少了一个功能，可以描述想改的地方，再查看工具的版本历史。\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"frame versions-shell\">\n        \u003cdiv class=\"chapter-bar\">工具版本历史示例\u003c/div>\n        \u003cul class=\"story\">\n          \u003cli>\u003ch3>交付跟进板\u003c/h3>\u003cp>已保存 3 条交付事项\u003c/p>\u003c/li>\n          \u003cli>\u003ch3>\u003cspan class=\"version\">v2\u003c/span> · 加了「本周到期」筛选\u003c/h3>\u003cp>保留原有记录，继续跟进。\u003c/p>\u003c/li>\n          \u003cli>\u003ch3>\u003cspan class=\"version\">v1\u003c/span> · 从交付跟进表创建\u003c/h3>\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n    \u003c/section>\n    \u003csection class=\"chapter workspace-entry\" aria-labelledby=\"root-site-start\">\n      \u003ch2 id=\"root-site-start\">有件事想做成工具？\u003c/h2>\n      \u003ca class=\"link-button primary cursor-interaction\" href=\"root-sign-in-review.html\">用自己的需求试试\u003c/a>\n      \u003cp class=\"trial-note\">生成自己的工具需登录工作台。受邀评审可在工作台选择「凭邀请码注册」，邀请码由项目方发放。\u003c/p>\n    \u003c/section>\n    \u003csection class=\"chapter chapter-soft feature\" id=\"root-site-about\" aria-labelledby=\"root-about-title\">\n      \u003cdiv>\n        \u003cp class=\"kicker\">关于我们\u003c/p>\n        \u003ch2 id=\"root-about-title\">关于 ROOT\u003c/h2>\n        \u003cp class=\"lead\">日常工作里总有些事值得有个专门的小工具。ROOT 让你用自己的话或已有的表格，做出符合自己用法的清单、看板和计算器。\u003c/p>\n        \u003caside class=\"roadmap-note\" id=\"root-site-roadmap\" aria-labelledby=\"root-roadmap-title\">\n          \u003ch3 id=\"root-roadmap-title\">开发计划\u003c/h3>\n          \u003cp>本轮 Demo 聚焦模板生成。网站模板计划覆盖单页落地页和多页品牌官网，可在工作台内预览和保存。\u003c/p>\n          \u003cp>后续会逐步开放页面组合和更灵活的生成能力。预计 11 月底更新进度。\u003c/p>\n        \u003c/aside>\n      \u003c/div>\n      \u003cdiv class=\"frame faq\" id=\"root-site-faq\">\n        \u003ch3 class=\"chapter-bar\">常见问题\u003c/h3>\n        \u003cdetails>\u003csummary class=\"cursor-interaction\">试用需要账号吗？\u003c/summary>\u003cp>点击「试用示例」即可在本页操作交付跟进板，无需登录。用自己的需求或表格生成工具时，需要登录工作台。\u003c/p>\u003c/details>\n        \u003cdetails>\u003csummary class=\"cursor-interaction\">邀请码从哪里获取？\u003c/summary>\u003cp>请向邀请你体验 ROOT 的项目方获取邀请码。收到后，点击「进入工作台」，选择「凭邀请码注册」并填入邀请码。新码自生成起 72 小时有效。此前发放的邀请码以原到期时间为准。每码可成功注册一次。过期或已使用时，请向邀请人索取新码。\u003c/p>\u003c/details>\n        \u003cdetails>\n          \u003csummary class=\"cursor-interaction\">ROOT 适合做哪些工具？\u003c/summary>\n          \u003cp>把你的文字需求做成可操作的网页工具。你可以用它登记和筛选记录、跟踪进度，或按自己的规则做测算。\u003c/p>\n          \u003cp>如果手头已有表格，可以导入带表头的 CSV 或 XLSX，确认字段后用原有记录生成工具。XLSX 读取第一个工作表。\u003c/p>\n        \u003c/details>\n        \u003cdetails>\n          \u003csummary class=\"cursor-interaction\">工具里的数据会保存吗？\u003c/summary>\n          \u003cp>登录工作台后，工具和里面的记录会保存到你的账号，可以从「我的工具」重新打开，保存期限按试用规则执行。官网试用用的是示例数据，刷新后会恢复原样。\u003c/p>\n        \u003c/details>\n        \u003cdetails>\n          \u003csummary class=\"cursor-interaction\">首版有哪些限制？\u003c/summary>\n          \u003cp>\u003cstrong>数据与协作\u003c/strong> · 暂不支持通用数据库、附件存储和多人共享编辑。\u003c/p>\n          \u003cp>\u003cstrong>声音与设备\u003c/strong> · 暂不支持音视频播放、录音和语音功能，也不支持调用摄像头、麦克风、蓝牙或 USB 设备。\u003c/p>\n          \u003cp>\u003cstrong>联网与自动化\u003c/strong> · 暂不支持同步原表、连接外部系统和定时后台任务。\u003c/p>\n        \u003c/details>\n        \u003cdetails>\u003csummary class=\"cursor-interaction\">可以把生成的工具公开发布吗？\u003c/summary>\u003cp>这个 Demo 的工具用于工作台内试用、保存和继续修改。公开发布暂未开放。\u003c/p>\u003c/details>\n      \u003c/div>\n    \u003c/section>\n    \u003cfooter class=\"site-footer\">\n      \u003cdiv class=\"brand\">ROOT\u003cspan class=\"dot\" aria-hidden=\"true\">\u003c/span>\u003c/div>\n      \u003cnav class=\"buttons\" aria-label=\"页尾导航\">\u003ca href=\"#root-site-about\">关于我们\u003c/a>\u003ca href=\"#root-site-faq\">常见问题\u003c/a>\u003ca href=\"#root-site-top\">返回顶部\u003c/a>\u003c/nav>\n    \u003c/footer>\n  \u003c/div>\n  \u003cscript>\n    (() => {\n      const root = document.getElementById('root-public-review');\n      const q = selector => root.querySelector(selector);\n      const items = Array.from(root.querySelectorAll('[data-item]'));\n      const filter = q('[data-filter]');\n      root.querySelectorAll('a[href^=\"#root-site-\"]').forEach(link => {\n        link.addEventListener('click', event => {\n          event.preventDefault();\n          const target = q(link.hash);\n          target.scrollIntoView({ block: 'start' });\n          if (target.id === 'root-site-trial') filter.focus({ preventScroll: true });\n        });\n      });\n      let filtered = false;\n      function update() {\n        let remaining = 0;\n        items.forEach(item => {\n          const completed = item.querySelector('input').checked;\n          const status = item.querySelector('[data-status]');\n          item.hidden = filtered && completed;\n          status.textContent = completed ? '已完成' : status.dataset.status;\n          if (!completed) remaining++;\n        });\n        q('[data-count]').textContent = `还有 ${remaining} 项未完成`;\n      }\n      filter.addEventListener('click', () => {\n        filtered = !filtered;\n        filter.setAttribute('aria-pressed', String(filtered));\n        filter.textContent = filtered ? '显示全部' : '只看未完成';\n        update();\n      });\n      items.forEach(item => item.addEventListener('change', update));\n    })();\n  \u003c/script>\n\u003c/div>\n\u003c/body>\n\u003c/html>\n";

      #root-public-review button, #root-public-review .link-button { min-height: 44px; }
    }`,
  workbench: `
    body { padding-inline: 0; }
    .elys-product { box-sizing: border-box; max-width: none; padding-inline: 0; border-radius: 0; }
    .elys-workspace { grid-template-columns: clamp(260px, 23vw, 320px) minmax(0, 1fr); gap: clamp(20px, 2vw, 32px); }
    .workspace-sidebar { padding-inline: 12px; }
    .elys-preview { min-width: 0; }
    @media (max-width: 760px) {
      .elys-workspace { grid-template-columns: minmax(0, 1fr); grid-template-areas: "sidebar" "content"; gap: 14px; }
      .elys-product button { min-height: 44px; }
      .elys-actions { flex-wrap: wrap; }
    }`
};

const state = { page: 'site', width: '1920', section: 'root-site-top', view: 'both' };
const grid = document.querySelector('.previews');
const panes = Array.from(grid.querySelectorAll('.pane'));
if (new URLSearchParams(location.search).get('view') === 'after') {
  state.view = 'after';
  grid.dataset.view = 'after';
  document.querySelectorAll('[data-group="view"] button').forEach(button => {
    button.setAttribute('aria-pressed', String(button.dataset.value === 'after'));
  });
}

function locate(pane) {
  const frame = pane.querySelector('iframe');
  if (state.page === 'site') {
    const target = frame.contentDocument?.getElementById(state.section);
    if (state.section === 'root-site-top') frame.contentWindow.scrollTo(0, 0);
    else if (target) frame.contentWindow.scrollTo(0, target.getBoundingClientRect().top + frame.contentWindow.scrollY - 12);
  }
}

function describe(pane) {
  const doc = pane.querySelector('iframe').contentDocument;
  const isSite = state.page === 'site';
  const outer = doc?.querySelector(isSite ? '.page' : '.elys-product');
  if (!outer) return;
  const dimensions = outer.getBoundingClientRect();
  const gridSelector = isSite ? '.hero' : '.elys-workspace';
  const columns = getComputedStyle(doc.querySelector(gridSelector)).gridTemplateColumns;
  const px = value => Math.round(value) + ' px';
  const columnSizes = columns.split(' ').map(value => px(parseFloat(value))).join(' / ');
  pane.querySelector('output').textContent =
    '外框 ' + px(dimensions.width) + ' · 外侧每边 ' + px(dimensions.left) + ' · ' +
    (columns.includes(' ') ? '左右列 ' : '单列 ') + columnSizes;
}

function size(pane) {
  const canvas = pane.querySelector('.canvas');
  if (!canvas.clientWidth) return;
  const viewport = canvas.querySelector('.viewport');
  const frame = viewport.querySelector('iframe');
  const width = Number(state.width);
  const scale = Math.min(1, canvas.clientWidth / width);
  const height = width === 390 ? 844 : 1050;
  frame.style.width = width + 'px';
  frame.style.height = height + 'px';
  frame.style.transform = 'scale(' + scale + ')';
  viewport.style.width = width * scale + 'px';
  viewport.style.height = height * scale + 'px';
}

function load() {
  for (const pane of panes) {
    size(pane);
    const frame = pane.querySelector('iframe');
    frame.onload = () => {
      locate(pane);
      describe(pane);
      frame.contentWindow.addEventListener('resize', () => describe(pane));
      frame.contentDocument?.querySelectorAll('[data-review-link]').forEach(link => {
        link.addEventListener('click', event => {
          event.preventDefault();
          location.href = 'root-sign-in-review.html';
        });
      });
      if (state.page === 'workbench' && pane.classList.contains('after')) {
        const routes = {
          'new-tool': 'root-new-tool-review.html',
          'idea-entry': 'root-workbench-entry.html?section=idea',
          'drafts-entry': 'root-workbench-entry.html?section=drafts',
          'library-entry': 'root-new-tool-review.html#my-tools'
        };
        for (const [id, href] of Object.entries(routes)) {
          frame.contentDocument.getElementById(id)?.addEventListener('click', () => { location.href = href; });
        }
      }
    };
    let html = state.page === 'site' && pane.classList.contains('after') ? currentSite : documents[state.page];
    if (pane.classList.contains('after')) {
      if (state.page === 'site') {
        html = html.replace('>立即试用</a>', '>试用示例</a>').replace(
          '点「立即试用」即可操作示例。',
          '点击「试用示例」即可在本页操作交付跟进板，无需登录。'
        );
      } else {
        html = html.replace(
          '<button id="library-entry"',
          '<button id="drafts-entry" type="button">我的需求</button><button id="library-entry"'
        );
      }
      html = html.replace('</body>', '<style>' + proposals[state.page] + '</style></body>');
    }
    frame.srcdoc = html;
  }
}

const slider = document.querySelector('#width-range');
function resizeTo(width) {
  state.width = width;
  slider.value = width;
  document.querySelector('#width-value').textContent = width + ' px';
  document.querySelectorAll('[data-group="width"] button').forEach(button => {
    button.setAttribute('aria-pressed', String(button.dataset.value === width));
  });
  panes.forEach(size);
  requestAnimationFrame(() => requestAnimationFrame(() => panes.forEach(pane => { locate(pane); describe(pane); })));
}
slider.addEventListener('input', () => resizeTo(slider.value));

document.querySelector('.toolbar').addEventListener('click', event => {
  const button = event.target.closest('button[data-value]');
  if (!button) return;
  const group = button.closest('[data-group]');
  const key = group.dataset.group;
  if (key === 'width') { resizeTo(button.dataset.value); return; }
  if (state[key] === button.dataset.value) return;
  state[key] = button.dataset.value;
  for (const peer of group.querySelectorAll('button')) {
    peer.setAttribute('aria-pressed', String(peer === button));
  }
  if (key === 'page') document.getElementById('sections').hidden = state.page !== 'site';
  if (key === 'view') {
    grid.dataset.view = state.view;
    panes.forEach(pane => { size(pane); describe(pane); });
  } else if (key === 'section') {
    panes.forEach(locate);
  } else {
    load();
  }
});
new ResizeObserver(() => panes.forEach(size)).observe(grid);
load();
</script>
</body>
</html>
