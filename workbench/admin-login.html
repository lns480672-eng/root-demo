<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理员登录 · ROOT</title>
<link rel="stylesheet" href="/admin.css">
<script src="/admin-login.js" defer></script>
</head>
<body>
<div class="shell">
  <header class="masthead">
    <div class="identity"><span class="wordmark">ROOT</span><span class="mark" aria-hidden="true"></span><span class="role-tag">管理后台</span></div>
    <a id="back-to-workbench" class="workbench-link" href="/">返回工作台</a>
  </header>
  <main class="panel credential-panel login-panel" aria-labelledby="login-title">
    <div class="intro">
      <h1 id="login-title">管理员登录</h1>
      <p>使用管理员账号进入后台，管理邀请码和用量。</p>
    </div>
    <form id="admin-login-form" class="credential-form" method="post">
      <label for="admin-username">管理员用户名</label>
      <input id="admin-username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="32" required>
      <label for="admin-password">管理员密码</label>
      <input id="admin-password" type="password" autocomplete="current-password" maxlength="128" required>
      <p id="admin-login-feedback" class="notice" role="status"></p>
      <button id="admin-login-submit" class="primary" type="submit">登录后台</button>
    </form>
  </main>
</div>
</body>
</html>
